name: Build & Release FolderPainter

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*.*.*"          # trigger on version tags like v1.0.0
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:      # allow manual run from GitHub UI

permissions:
  contents: write         # needed to create GitHub Releases

jobs:
  build:
    name: Build self-contained EXE (Windows x64)
    runs-on: windows-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup .NET ──────────────────────────────────────────────────
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      # ── 3. Restore dependencies ────────────────────────────────────────
      - name: Restore NuGet packages
        run: dotnet restore src/FolderPainter.csproj

      # ── 4. Build (Debug – fast feedback on PRs) ───────────────────────
      - name: Build (Debug)
        run: dotnet build src/FolderPainter.csproj --configuration Debug --no-restore

      # ── 5. Publish single-file self-contained EXE ─────────────────────
      - name: Publish single-file EXE
        run: |
          dotnet publish src/FolderPainter.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            -p:PublishSingleFile=true `
            --output publish/

      # ── 6. List publish output (for debugging) ─────────────────────────
      - name: List published files
        run: Get-ChildItem publish\ -Recurse | Select-Object FullName

      # ── 7. Upload EXE as build artifact (available on every push) ──────
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolderPainter-win-x64
          path: publish/FolderPainter.exe
          if-no-files-found: error

      # ── 8. Create GitHub Release (only on version tags) ────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Folder Painter ${{ github.ref_name }}"
          body: |
            ## Folder Painter ${{ github.ref_name }}

            ### Installation
            1. Download **FolderPainter.exe** below.
            2. Run it once — click **Register** to add the right-click menu entry.
               *(Run as Administrator if prompted.)*
            3. Right-click any folder → **🎨 Paint Folder**.

            ### Requirements
            - Windows 10 or 11 (x64)
            - Requires .NET 8.0 Desktop Runtime.

            ### Uninstall
            Run FolderPainter.exe again → click **Unregister**.
          files: publish/FolderPainter.exe
          draft: false
          prerelease: false
