name: Build Installer

on:
  push:
    branches: [ "main", "master" ]
    tags:     [ "v*" ]          # also fires on version tags like v1.0.0
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:             # allow manual trigger from GitHub UI

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write            # needed to upload release assets

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ── 3. Install dependencies ─────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      # ── 4. Generate icons (in case they are missing from the repo) ──────────
      - name: Generate icons
        run: python generate_icons.py
        continue-on-error: true   # skip gracefully if icons already committed

      # ── 5. Build standalone EXE with PyInstaller ────────────────────────────
      - name: Build EXE with PyInstaller
        run: >
          pyinstaller
          --onefile
          --windowed
          --name folder_colorizer
          --icon icons/orange.ico
          --add-data "icons;icons"
          folder_colorizer.py

      # ── 6. Install Inno Setup ───────────────────────────────────────────────
      - name: Install Inno Setup 6
        run: |
          choco install innosetup --yes --no-progress
        shell: powershell

      # ── 7. Compile the installer ────────────────────────────────────────────
      - name: Compile installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
        shell: powershell

      # ── 8. Upload installer as build artifact ───────────────────────────────
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolderColorizer-Setup
          path: output\FolderColorizer-Setup-*.exe
          retention-days: 30

      # ── 9. Create GitHub Release (only on version tags) ─────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output\FolderColorizer-Setup-*.exe
          generate_release_notes: true
