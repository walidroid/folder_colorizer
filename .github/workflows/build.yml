name: Build Installer

on:
  push:
    branches: [ "main", "master" ]
    tags:     [ "v*" ]          # also fires on version tags like v1.0.0
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:             # allow manual trigger from GitHub UI

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write            # needed to upload release assets

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Install dependencies ─────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      # ── 4. Generate icons (in case they are missing from the repo) ──────────
      - name: Generate icons
        run: python generate_icons.py
        continue-on-error: true   # skip gracefully if icons already committed

      # ── 5. Build standalone EXE with PyInstaller ────────────────────────────
      - name: Build EXE with PyInstaller
        run: >
          pyinstaller
          --onefile
          --windowed
          --name folder_colorizer
          --icon icons/orange.ico
          --add-data "icons;icons"
          folder_colorizer.py

      # ── 6. Install Inno Setup ───────────────────────────────────────────────
      - name: Install Inno Setup 6
        run: |
          choco install innosetup --yes --no-progress
        shell: powershell

      # ── 7. Compile the installer ────────────────────────────────────────────
      - name: Compile installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
        shell: powershell

      # ── 8. Zip the installer for release upload ────────────────────────────
      - name: Zip installer
        run: |
          Compress-Archive -Path output\FolderColorizer-Setup-*.exe `
                           -DestinationPath output\FolderColorizer-Setup.zip
        shell: powershell

      # ── 9. Upload as Actions artifact (accessible from the workflow run) ────
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolderColorizer-Setup
          path: output\FolderColorizer-Setup.zip
          retention-days: 30

      # ── 10. Publish / update the rolling "latest" release ────────────────────
      #        Runs on every push to main/master so the Releases page always
      #        shows the newest build even without a version tag.
      - name: Publish rolling "latest" release
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build"
          body: |
            🔄 **Automatically updated on every push to main.**

            Download `FolderColorizer-Setup.zip`, extract it, and run the `.exe` installer.
            This release always contains the most recent successful build.
          prerelease: true
          files: output\FolderColorizer-Setup.zip
          make_latest: false   # versioned releases stay pinned as "latest"

      # ── 11. Create a proper versioned release on version tags (v1.x.x) ───────
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output\FolderColorizer-Setup.zip
          generate_release_notes: true
          make_latest: true
