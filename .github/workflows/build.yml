name: Build Installer

on:
  push:
    branches: [ "main", "master" ]
    tags:     [ "v*" ]          # also fires on version tags like v1.0.0
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:             # allow manual trigger from GitHub UI

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write            # needed to upload release assets

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Configure MSVC environment ────────────────────────────────────────
      #    windows-latest ships with Visual Studio Build Tools pre-installed.
      #    The cmake action handles PATH/VCVARS automatically.
      - name: Configure CMake (Release, x64)
        run: |
          cmake -B build -A x64 -DCMAKE_BUILD_TYPE=Release
        shell: pwsh

      # ── 3. Build EXE ─────────────────────────────────────────────────────────
      - name: Build with CMake
        run: |
          cmake --build build --config Release --parallel
        shell: pwsh

      # ── 4. Verify the EXE exists ─────────────────────────────────────────────
      - name: Verify EXE
        run: |
          if (!(Test-Path "build\Release\folder_colorizer.exe")) {
            Write-Error "Build output not found!"
            exit 1
          }
          Write-Host "Build succeeded: build\Release\folder_colorizer.exe"
        shell: pwsh

      # ── 5. Install Inno Setup ────────────────────────────────────────────────
      - name: Install Inno Setup 6
        run: choco install innosetup --yes --no-progress
        shell: pwsh

      # ── 6. Compile the installer ─────────────────────────────────────────────
      - name: Compile installer with Inno Setup
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
        shell: pwsh

      # ── 7. Zip the installer ─────────────────────────────────────────────────
      - name: Zip installer
        run: |
          Compress-Archive -Path output\FolderColorizer-Setup-*.exe `
                           -DestinationPath output\FolderColorizer-Setup.zip
        shell: pwsh

      # ── 8. Upload as Actions artifact ────────────────────────────────────────
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FolderColorizer-Setup
          path: output\FolderColorizer-Setup.zip
          retention-days: 30

      # ── 9. Publish rolling "latest" release ──────────────────────────────────
      #       Runs on every push to main/master (no version tag).
      - name: Publish rolling "latest" release
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build"
          body: |
            🔄 **Automatically updated on every push to main.**

            Download `FolderColorizer-Setup.zip`, extract it, and run the `.exe` installer.
            This release always contains the most recent successful build.

            **Built with:** MSVC (Visual Studio, windows-latest runner) — no Python required.
          prerelease: true
          files: output\FolderColorizer-Setup.zip
          make_latest: false   # versioned releases stay pinned as "latest"

      # ── 10. Create a proper versioned release on version tags (v1.x.x) ───────
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: output\FolderColorizer-Setup.zip
          generate_release_notes: true
          make_latest: true
